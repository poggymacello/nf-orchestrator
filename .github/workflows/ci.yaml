name: CI

# Runs on every branch push, not only on main and pull requests. This project does its
# work on long-lived day branches, and until M5 none of them had ever been through CI.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless, and the e2e job costs
# a cluster.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # The e2e tests skip themselves without NF_E2E, so this stays a no-cluster run.
      - run: pytest
      # The alert rules, evaluated against series the drills produced (drill 12 found a rule
      # that had only ever been read, never run). Same image as the drills, pinned.
      - name: Alert rules
        run: |
          docker run --rm -v "$PWD/monitoring:/monitoring" --entrypoint promtool             prom/prometheus@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893             check rules /monitoring/nf-lifecycle.rules.yml
          docker run --rm -v "$PWD/monitoring:/monitoring" --entrypoint promtool             prom/prometheus@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893             test rules /monitoring/tests/nf-lifecycle.rules.test.yml

  # Secret scanning over the whole history, not just the diff: a secret committed
  # three months ago and deleted since is still in the pack file.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo"             zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f             detect --source=/repo --no-banner --redact --exit-code 1

  # The private-term list is not in this repository, by design. It arrives as a
  # secret; the scanner never prints a term, not even inside a path. See ADR-0010.
  banned-terms:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan tracked files for private terms
        env:
          BANNED_TERMS: ${{ secrets.BANNED_TERMS }}
        run: python scripts/scan_banned_terms.py

  # Two different questions, one tool. `config` reads the chart for insecure
  # defaults; `fs` reads the resolved dependency set for known CVEs. Both fail the
  # build only on HIGH and CRITICAL — the accepted MEDIUM and LOW findings are listed
  # in ADR-0011 and still printed here.
  vuln-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Chart misconfiguration
        run: |
          docker run --rm -v "$PWD:/repo" aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969             config /repo/charts --exit-code 1 --severity HIGH,CRITICAL

      # Trivy needs a dependency file to read. pyproject.toml alone leaves it with
      # nothing to scan, and a scanner with no target reports clean forever.
      - name: Freeze the dependency set CI actually installs
        run: |
          pip install -e ".[dev]"
          mkdir -p .trivy-deps
          pip freeze > .trivy-deps/requirements.txt
          wc -l .trivy-deps/requirements.txt

      - name: Dependency vulnerabilities
        run: |
          docker run --rm -v "$PWD/.trivy-deps:/deps" aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969             fs /deps --scanners vuln --exit-code 1 --severity HIGH,CRITICAL

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Day 16 ran whatever kind-action defaulted to, and passing on a version I had not
    # chosen was luck. Two pinned versions, so cross-version support is asserted rather
    # than hoped for.
    strategy:
      fail-fast: false
      matrix:
        k8s: ["v1.34.0", "v1.35.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"

      # Third-party actions are pinned to a commit rather than a tag: a tag can be
      # moved onto different code, a commit cannot.
      #
      # Helm 4 specifically. The M4 drill-3 behaviour this job asserts — a server-side
      # apply conflict, and --force-conflicts taking the field back — does not exist in
      # Helm 3, which would merge client-side and silently win.
      - name: Install Helm 4
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.2

      - name: Create the kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          cluster_name: nf-orchestrator
          config: kind-config.yaml
          node_image: kindest/node:${{ matrix.k8s }}

      - name: Record the versions this run actually used
        run: |
          helm version --short
          kubectl version --client=true
          kubectl config current-context
          kubectl --context kind-nf-orchestrator get nodes

      - name: End-to-end lifecycle against the cluster
        run: pytest tests/e2e -v
        env:
          NF_E2E: "1"

      - name: Cluster diagnostics
        if: failure()
        run: |
          kubectl --context kind-nf-orchestrator get pods -A
          kubectl --context kind-nf-orchestrator get events --sort-by=.lastTimestamp | tail -40
          helm list --kube-context kind-nf-orchestrator --all
