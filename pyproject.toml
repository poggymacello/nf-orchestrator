[project]
name = "nf-orchestrator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "prometheus-client",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[tool.setuptools]
packages = ["orchestrator"]

[tool.ruff]
line-length = 100
