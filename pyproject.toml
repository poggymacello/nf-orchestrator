[project]
name = "nf-orchestrator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "prometheus-client",
]

[project.optional-dependencies]
# The model-backed translator is opt-in. The core loop, the tests and CI all run
# without it and without a key -- see ADR-0013.
llm = [
    "anthropic",
]
dev = [
    "pytest",
    "httpx",
    "ruff",
    # Read by tests/test_doc_claims.py. Declared explicitly: it was only in the local
    # virtualenv because it had once been installed by hand, and CI would not have had it.
    "pyyaml",
]

[tool.setuptools]
packages = ["orchestrator"]

[tool.ruff]
line-length = 100
