# Prometheus config used for the M4 stability work on 2026-08-22.
#
# The orchestrator runs on the host, Prometheus runs in a container, so the target
# is host.docker.internal. Every scrape reconciles every Helm release through the
# lifecycle collector, which is what makes the state series exist on an interval
# rather than only when someone calls the API.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/nf-lifecycle.rules.yml

scrape_configs:
  - job_name: nf-orchestrator
    static_configs:
      - targets: ["host.docker.internal:8000"]
