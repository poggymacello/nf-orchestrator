# Lifecycle alerting rules.
#
# Every rule here carries a `for:` clause, and that is the point. The lifecycle state
# is derived per scrape, so a single sample is an instant, not a state: a routine pod
# replacement moves a release out of INSTANTIATED for a second or two with nothing
# wrong. `for:` is where "stable" is defined — the condition must hold across every
# evaluation in the window before the alert fires. See ADR-0007.
groups:
  - name: nf-lifecycle
    rules:
      - alert: NFNotInstantiated
        expr: nf_deployment_state{state="INSTANTIATED"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.release }} has not been INSTANTIATED for 2 minutes"
          description: >-
            The release exists but the intent is not satisfied. Check
            nf_deployment_ready_replicas against nf_deployment_desired_replicas, then
            follow runbooks/deployment-not-reaching-instantiated.md.

      - alert: NFFailed
        expr: nf_deployment_state{state="FAILED"} == 1
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.release }} is FAILED"
          description: >-
            A pod cannot become healthy, or stopped and was not replaced. Shorter
            window than NFNotInstantiated because FAILED is already a settled
            judgement rather than a rollout in progress.

      - alert: NFReplicaShortfall
        expr: nf_deployment_ready_replicas < nf_deployment_desired_replicas
        for: 2m
        labels:
          severity: warn
        annotations:
          summary: "{{ $labels.release }} is short of the replicas its intent asked for"
          description: >-
            Fires on drift as well as on a stuck rollout: something may have scaled
            the Deployment outside Helm.

      - alert: ClusterUnreachable
        expr: nf_cluster_reachable == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "The orchestrator cannot reach the cluster"
          description: >-
            No release series are being written while this fires. Do not read the
            absence of nf_deployment_state as deployments being gone — follow
            runbooks/control-plane-unreachable.md.

      - alert: NFLastOperationFailed
        expr: nf_last_operation_state{state="FAILED"} == 1
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "{{ $labels.release }}'s last lifecycle operation failed"
          description: >-
            The network function may be perfectly healthy — this is about the
            operation, not the NF. Check the state separately. A failed operation stays
            recorded until something succeeds, so this fires on an unresolved failure
            nobody has cleared. Longer window than the NF alerts because it is not an
            outage.

      # Every rule above reads a metric the orchestrator emits, so every rule above is
      # silent when the scrape itself fails. Drill 6 found exactly that: a frozen control
      # plane made /metrics slower than the scrape timeout, and nf_cluster_reachable had
      # no series at all while ClusterUnreachable waited for a 0 that never arrived.
      - alert: OrchestratorScrapeFailing
        expr: up{job="nf-orchestrator"} == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Prometheus cannot scrape the orchestrator"
          description: >-
            Every lifecycle alert depends on this scrape succeeding, so while this
            fires none of them can. Either the orchestrator is down, or /metrics is
            slower than the scrape timeout — check the target's lastError.

      # The scrape now stops at its budget instead of failing whole (drill 7), which
      # moves the gap somewhere quieter: a release that did not finish in time simply has
      # no series, and every per-release rule above is silent about it. It is the same
      # releases every scrape, so this names them rather than counting them.
      - alert: NFReleaseUnreported
        expr: nf_release_reported == 0
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "{{ $labels.release }} has no lifecycle series, so nothing can alert on it"
          description: >-
            The scrape is up, but this release is not being reported. Check
            nf_releases_unreported: reason="deadline" means the scrape ran out of
            budget (too many releases or a slow API server) and will keep skipping the
            same releases; reason="error" means reading this release failed. Follow
            runbooks/scrape-over-budget.md.

      # Drill 9: the API server shed the orchestrator's requests with 429 while answering
      # /readyz instantly. Before this, that read as ClusterUnreachable — a page that sends
      # someone to restart a control plane that is up. It is a different incident: the
      # cluster is there, and this client is being throttled or the server is overloaded.
      #
      # Drill 10: under APF queueing the same incident is intermittent — the probe took
      # 0.25-0.80s against 0.25s idle, so the per-scrape signal flipped between 1 and 0
      # and `nf_cluster_busy == 1` never held for a whole `for:` window. The alert now
      # asks how much of the window was throttled, which a flapping signal can answer.
      - alert: ClusterThrottlingOrchestrator
        expr: avg_over_time(nf_cluster_busy[2m]) >= 0.5
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "The API server is reachable but not serving the orchestrator"
          description: >-
            Lifecycle series are partly or wholly missing because the orchestrator's
            requests are being throttled or the API server is overloaded, not because it
            is down. Check API Priority and Fairness for the orchestrator's identity
            before restarting anything — follow runbooks/cluster-throttling.md.
            nf_cluster_probe_seconds is the measurement behind this: how long the API
            server took to answer the cheapest call it serves.
